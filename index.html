<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fuga de Escala</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
      }
      #game-container {
        position: relative;
      }
      #start-screen, #game-over-screen {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background-color: rgba(0, 0, 0, 0.7);
        color: white;
        z-index: 10;
      }
      #game-over-screen {
        display: none;
      }
      button {
        margin: 10px;
        padding: 10px 20px;
        font-size: 18px;
        cursor: pointer;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 5px;
      }
      button:hover {
        background-color: #45a049;
      }
      h1 {
        font-size: 48px;
        margin-bottom: 30px;
        text-shadow: 2px 2px 4px #000000;
      }
      #burnout {
        font-size: 72px;
        color: red;
        font-weight: bold;
        text-shadow: 3px 3px 6px #000000;
        margin-bottom: 20px;
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <div id="start-screen">
        <h1>Fuga de Escala</h1>
        <p>Digite seu nome para começar:</p>
        <input type="text" id="player-name" placeholder="Seu nome">
        <button id="start-button">Começar</button>
      </div>
      
      <div id="game-over-screen">
        <div id="burnout">BurnOut</div>
        <p>Pedir as contas?</p>
        <div>
          <button id="yes-button">Sim</button>
          <button id="no-button">Não</button>
        </div>
      </div>
      
      <script>
        // Variáveis do jogo
        let bird;
        let pipes = [];
        let score = 0;
        let gameStarted = false;
        let gameOver = false;
        let playerName = "";
        let birdImg, bgImg, pipeImg;
        let birdSize = 40;
        let topScores = JSON.parse(localStorage.getItem('topScores')) || [];
        
        // Elementos da interface
        let startScreen, gameOverScreen, nameInput, startButton, yesButton, noButton, burnoutText;
        
        function preload() {
          // Tenta carregar imagens locais, se não encontrar, usa fallbacks
          bgImg = loadImage('fundo.jpg', 
            () => console.log('Fundo local carregado'), 
            () => bgImg = loadImage('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=600&q=80')
          );
          
          birdImg = loadImage('personagem.jpg', 
            () => console.log('Personagem local carregado'), 
            () => birdImg = null
          );
          
          pipeImg = loadImage('cano.jpg', 
            () => console.log('Cano local carregado'), 
            () => pipeImg = null
          );
        }
        
        function setup() {
          createCanvas(windowWidth, windowHeight);
          
          // Configura elementos da interface
          startScreen = select('#start-screen');
          gameOverScreen = select('#game-over-screen');
          nameInput = select('#player-name');
          startButton = select('#start-button');
          yesButton = select('#yes-button');
          noButton = select('#no-button');
          burnoutText = select('#burnout');
          
          // Configura eventos
          startButton.mousePressed(startGame);
          yesButton.mousePressed(endGame);
          noButton.mousePressed(restartGame);
          
          // Inicializa o pássaro
          bird = new Bird();
        }
        
        function draw() {
          if (!gameStarted) return;
          
          // Desenha o fundo
          if (bgImg) {
            image(bgImg, 0, 0, width, height);
          } else {
            background(135, 206, 235); // Azul céu como fallback
          }
          
          if (gameOver) return;
          
          // Atualiza e desenha o pássaro
          bird.update();
          bird.show();
          
          // Gera novos canos
          if (frameCount % 90 === 0) {
            pipes.push(new Pipe());
          }
          
          // Atualiza e desenha os canos
          for (let i = pipes.length - 1; i >= 0; i--) {
            pipes[i].update();
            pipes[i].show();
            
            // Verifica colisão
            if (pipes[i].hits(bird)) {
              gameOver = true;
              showGameOver();
            }
            
            // Remove canos que saíram da tela e incrementa pontuação
            if (pipes[i].offscreen()) {
              pipes.splice(i, 1);
              score++;
            }
          }
          
          // Mostra a pontuação
          fill(255);
          stroke(0);
          strokeWeight(2);
          textSize(28);
          textAlign(CENTER, TOP);
          text("Pontuação: " + score, width / 2, 20);
          
          // Mostra os melhores scores
          drawTopScores();
        }
        
        function drawTopScores() {
          if (topScores.length === 0) return;
          
          fill(0, 0, 0, 180);
          noStroke();
          rect(10, 60, 220, 30 + topScores.length * 25, 10);
          
          fill(255);
          textSize(18);
          textAlign(LEFT, TOP);
          text("Melhores Fugas:", 20, 70);
          
          for (let i = 0; i < topScores.length; i++) {
            text(`${i + 1}. ${topScores[i].name}: ${topScores[i].score}`, 20, 100 + i * 25);
          }
        }
        
        function startGame() {
          playerName = nameInput.value().trim();
          if (playerName === "") {
            playerName = "Anônimo";
          }
          
          startScreen.hide();
          gameStarted = true;
          gameOver = false;
          loop(); // Garante que o draw() seja chamado
        }
        
        function showGameOver() {
          burnoutText.show();
          gameOverScreen.style('display', 'flex');
          noLoop();
        }
        
        function endGame() {
          // Adiciona ao ranking se for um dos melhores
          if (topScores.length < 5 || score > topScores[topScores.length - 1].score) {
            topScores.push({ name: playerName, score: score });
            topScores.sort((a, b) => b.score - a.score);
            if (topScores.length > 5) topScores.pop();
            
            // Salva no localStorage
            localStorage.setItem('topScores', JSON.stringify(topScores));
          }
          
          // Mostra tela inicial novamente
          gameOverScreen.hide();
          startScreen.show();
          burnoutText.hide();
          resetGame();
        }
        
        function restartGame() {
          gameOverScreen.hide();
          burnoutText.hide();
          resetGame();
          loop();
        }
        
        function resetGame() {
          score = 0;
          gameOver = false;
          bird = new Bird();
          pipes = [];
        }
        
        function keyPressed() {
          if ((key === ' ' || keyCode === UP_ARROW) && gameStarted && !gameOver) {
            bird.up();
          }
        }
        
        function mousePressed() {
          if (gameStarted && !gameOver) {
            bird.up();
          }
        }
        
        function windowResized() {
          resizeCanvas(windowWidth, windowHeight);
        }
        
        // Classe do Pássaro
        class Bird {
          constructor() {
            this.y = height / 2;
            this.x = width / 4;
            this.gravity = 0.6;
            this.lift = -12;
            this.velocity = 0;
            this.size = birdSize;
          }
          
          show() {
            if (birdImg) {
              image(birdImg, this.x - this.size/2, this.y - this.size/2, this.size, this.size);
            } else {
              fill(255, 204, 0);
              ellipse(this.x, this.y, this.size, this.size);
              fill(0);
              textSize(16);
              textAlign(CENTER, CENTER);
              text("OP", this.x, this.y);
            }
          }
          
          up() {
            this.velocity += this.lift;
          }
          
          update() {
            this.velocity += this.gravity;
            this.velocity *= 0.9;
            this.y += this.velocity;
            
            // Limites da tela
            if (this.y > height - this.size/2) {
              this.y = height - this.size/2;
              this.velocity = 0;
            }
            
            if (this.y < this.size/2) {
              this.y = this.size/2;
              this.velocity = 0;
            }
          }
        }
        
        // Classe dos Canos
        class Pipe {
          constructor() {
            this.w = 80;
            this.x = width;
            this.speed = 3;
            
            // Define a abertura entre os canos (3 a 5 vezes o tamanho do pássaro)
            this.gap = random(birdSize * 3, birdSize * 5);
            
            // Posição do cano de cima (o de baixo será this.top + this.gap)
            this.top = random(height/6, height - this.gap - height/6);
            this.bottom = this.top + this.gap;
          }
          
          hits(bird) {
            // Verifica se o pássaro está dentro da área dos canos
            if (bird.x + bird.size/2 > this.x && bird.x - bird.size/2 < this.x + this.w) {
              // Verifica se está acima do cano de cima ou abaixo do cano de baixo
              if (bird.y - bird.size/2 < this.top || bird.y + bird.size/2 > this.bottom) {
                return true;
              }
            }
            return false;
          }
          
          show() {
            if (pipeImg) {
              // Cano de cima (invertido)
              push();
              translate(this.x, this.top);
              scale(1, -1);
              image(pipeImg, 0, 0, this.w, this.top);
              pop();
              
              // Cano de baixo
              image(pipeImg, this.x, this.bottom, this.w, height - this.bottom);
            } else {
              // Fallback gráfico
              fill(34, 139, 34);
              rect(this.x, 0, this.w, this.top);
              rect(this.x, this.bottom, this.w, height - this.bottom);
              
              fill(255);
              textSize(16);
              textAlign(CENTER, CENTER);
              text("Escala", this.x + this.w/2, this.top/2);
              text("Escala", this.x + this.w/2, this.bottom + (height - this.bottom)/2);
            }
          }
          
          update() {
            this.x -= this.speed;
          }
          
          offscreen() {
            return this.x < -this.w;
          }
        }
      </script>
    </div>
  </body>
</html>
