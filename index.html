<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Fugitivo da Escala</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #0a0a1a;
        font-family: 'Orbitron', Arial, sans-serif;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
      #game-container {
        position: relative;
        width: 100%;
        height: 100vh;
        touch-action: none;
      }
      #start-screen, #game-over-screen {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, rgba(10,10,30,0.9) 0%, rgba(30,5,60,0.9) 100%);
        color: #0ff;
        z-index: 10;
        text-align: center;
      }
      #game-over-screen {
        display: none;
      }
      .cyber-box {
        background: rgba(0, 20, 40, 0.8);
        border: 2px solid #0ff;
        box-shadow: 0 0 15px #0ff, inset 0 0 10px #0ff;
        padding: 20px;
        border-radius: 5px;
        width: 85%;
        max-width: 500px;
        margin: 15px;
      }
      .title-box {
        background: rgba(0, 10, 20, 0.7);
        border: 1px solid #f0f;
        box-shadow: 0 0 10px #f0f;
        padding: 10px;
        margin-bottom: 15px;
      }
      button {
        margin: 10px;
        padding: 12px 25px;
        font-size: 16px;
        cursor: pointer;
        background: linear-gradient(45deg, #ff00cc, #3333ff);
        color: white;
        border: none;
        border-radius: 0;
        transition: all 0.3s;
        font-family: 'Orbitron', sans-serif;
        min-width: 120px;
      }
      button:hover {
        box-shadow: 0 0 15px #ff00cc, 0 0 25px #3333ff;
        transform: translateY(-3px);
      }
      h1 {
        font-size: 1.5rem;
        margin: 0;
        text-shadow: 0 0 10px #0ff;
        color: #0ff;
      }
      #burnout {
        font-size: 2.5rem;
        color: #f00;
        font-weight: bold;
        text-shadow: 0 0 10px #f00;
        margin-bottom: 20px;
        display: none;
      }
      input {
        background: rgba(0, 10, 20, 0.7);
        border: 1px solid #0ff;
        color: #0ff;
        padding: 10px;
        font-size: 16px;
        margin: 10px 0;
        width: 80%;
        max-width: 300px;
        text-align: center;
        font-family: 'Orbitron', sans-serif;
      }
      .button-container {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
      }
      .scanlines {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          to bottom,
          rgba(0, 255, 255, 0.05) 0%,
          rgba(0, 255, 255, 0) 10%
        );
        background-size: 100% 4px;
        pointer-events: none;
        z-index: 5;
      }
      .noise {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADIAAAAyCAYAAAAeP4ixAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAABnSURBVGhD7cExAQAwDMCg+zfd2VAp5JVBXtnllV1e2eWVXV7Z5ZVdXtnllV1e2eWVXV7Z5ZVdXtnllV1e2eWVXV7Z5ZVdXtnllV1e2eWVXV7Z5ZVdXtnllV1e2eWVXV7Z5ZVdXtnllV1e2eWVXV7Z5Q1Q5AERp1j3JAAAAABJRU5ErkJggg==');
        opacity: 0.03;
        pointer-events: none;
        z-index: 6;
      }
      canvas {
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 1;
        touch-action: none;
      }
      
      @media (max-width: 768px) {
        .cyber-box {
          padding: 15px;
          width: 90%;
        }
        h1 {
          font-size: 1.3rem;
        }
        button {
          padding: 12px 20px;
          font-size: 14px;
          min-width: 100px;
        }
        #burnout {
          font-size: 2rem;
        }
        input {
          font-size: 14px;
          padding: 8px;
        }
        .title-box {
          padding: 8px;
        }
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <div class="scanlines"></div>
      <div class="noise"></div>
      
      <div id="start-screen">
        <div class="cyber-box">
          <div class="title-box">
            <h1>FUGITIVO DA ESCALA</h1>
          </div>
          <p>Digite seu nome para começar:</p>
          <input type="text" id="player-name" placeholder="Seu nome">
          <button id="start-button">Começar</button>
        </div>
      </div>
      
      <div id="game-over-screen">
        <div class="cyber-box">
          <div id="burnout">BURNOUT</div>
          <p>Pedir as contas?</p>
          <div class="button-container">
            <button id="yes-button">Sim</button>
            <button id="no-button">Não</button>
          </div>
        </div>
      </div>
      
      <script>
        // Variáveis do jogo
        let bird;
        let pipes = [];
        let score = 0;
        let gameStarted = false;
        let gameOver = false;
        let playerName = "";
        let birdImg, bgImg, pipeImg;
        let birdSize = 40;
        let isMobile = false;
        let lastTapTime = 0;
        let tapDelay = 300;
        
        // TOP SCORES - Agora usando localStorage
        let topScores = JSON.parse(localStorage.getItem('fugitivoTopScores')) || [];
        
        // Elementos da interface
        let startScreen, gameOverScreen, nameInput, startButton, yesButton, noButton, burnoutText;
        let canvas;
        
        function preload() {
          bgImg = loadImage('fundo.jpeg', 
            () => console.log('Fundo carregado'), 
            () => bgImg = null
          );
          birdImg = loadImage('personagem.jpg', 
            () => console.log('Personagem carregado'), 
            () => birdImg = null
          );
          pipeImg = loadImage('cano.jpg', 
            () => console.log('Cano carregado'), 
            () => pipeImg = null
          );
        }
        
        function setup() {
          isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
          
          canvas = createCanvas(windowWidth, windowHeight);
          canvas.parent('game-container');
          
          // Configura elementos da interface
          startScreen = select('#start-screen');
          gameOverScreen = select('#game-over-screen');
          nameInput = select('#player-name');
          startButton = select('#start-button');
          yesButton = select('#yes-button');
          noButton = select('#no-button');
          burnoutText = select('#burnout');
          
          // Configura eventos
          startButton.mousePressed(startGame);
          yesButton.mousePressed(() => location.reload());
          noButton.mousePressed(restartGame);
          
          if (isMobile) {
            canvas.elt.addEventListener('touchstart', handleTouchStart, { passive: false });
            canvas.elt.addEventListener('touchend', handleTouchEnd, { passive: false });
          }
          
          resetBird();
          canvas.hide();
          frameRate(30);
        }
        
        function resetBird() {
          bird = new Bird();
          if (isMobile) {
            birdSize = 30;
            bird.lift = -9;
            bird.gravity = 0.5;
          }
        }
        
        function draw() {
          if (!gameStarted) return;
          
          clear();
          
          if (bgImg) {
            image(bgImg, 0, 0, width, height);
          } else {
            background(10, 5, 30);
            stroke(0, 255, 255, 50);
            noFill();
            for (let i = 0; i < 5; i++) {
              beginShape();
              for (let x = 0; x < width; x += 20) {
                let y = noise(x * 0.01, i * 100, frameCount * 0.01) * height;
                vertex(x, y);
              }
              endShape();
            }
          }
          
          if (gameOver) return;
          
          bird.update();
          bird.show();
          
          if (frameCount % 90 === 0 || (pipes.length > 0 && pipes[pipes.length-1].x < width - 300)) {
            pipes.push(new Pipe());
          }
          
          for (let i = pipes.length - 1; i >= 0; i--) {
            pipes[i].update();
            pipes[i].show();
            
            if (pipes[i].hits(bird)) {
              gameOver = true;
              showGameOver();
            }
            
            if (!pipes[i].counted && bird.x > pipes[i].x + pipes[i].w) {
              pipes[i].counted = true;
              score++;
            }
            
            if (pipes[i].offscreen()) {
              pipes.splice(i, 1);
            }
          }
          
          drawCyberText("PONTOS: " + score, width / 2, 30, isMobile ? 24 : 32, color(0, 255, 255));
          drawTopScores();
        }
        
        function drawCyberText(txt, x, y, size, col) {
          push();
          textFont('Orbitron');
          textSize(size);
          textAlign(CENTER);
          drawingContext.shadowBlur = 15;
          drawingContext.shadowColor = col;
          fill(0);
          stroke(col);
          strokeWeight(3);
          text(txt, x, y);
          drawingContext.shadowBlur = 0;
          pop();
        }
        
        function drawTopScores() {
          if (topScores.length === 0) return;
          
          let rectWidth = isMobile ? 180 : 240;
          let rectHeight = isMobile ? 30 + topScores.length * 25 : 40 + topScores.length * 30;
          
          fill(0, 20, 40, 200);
          stroke(0, 255, 255);
          strokeWeight(2);
          rect(20, 70, rectWidth, rectHeight, 5);
          
          drawCyberText("TOP FUJÕES", 20 + rectWidth/2, isMobile ? 90 : 100, isMobile ? 16 : 20, color(255, 0, 255));
          
          for (let i = 0; i < Math.min(topScores.length, 5); i++) {
            let yPos = isMobile ? 115 + i * 25 : 130 + i * 30;
            let neonColor = i === 0 ? color(255, 255, 0) : 
                           i === 1 ? color(200, 200, 200) : 
                           i === 2 ? color(205, 127, 50) : 
                           color(0, 255, 255);
            
            drawCyberText(`${i + 1}. ${topScores[i].name}: ${topScores[i].score}`, 
                          20 + rectWidth/2, yPos, 
                          isMobile ? 14 : 16, 
                          neonColor);
          }
        }
        
        function startGame() {
          playerName = nameInput.value().trim() || "Anônimo";
          startScreen.hide();
          gameStarted = true;
          gameOver = false;
          canvas.show();
          loop();
        }
        
        function showGameOver() {
          burnoutText.show();
          gameOverScreen.style('display', 'flex');
          noLoop();
          checkHighScore();
        }
        
        function restartGame() {
          gameOverScreen.hide();
          burnoutText.hide();
          resetGame();
          loop();
        }
        
        function checkHighScore() {
          let newScore = { name: playerName, score: score };
          let shouldAdd = false;
          
          if (topScores.length < 5) {
            shouldAdd = true;
          } else {
            for (let i = 0; i < topScores.length; i++) {
              if (score > topScores[i].score) {
                shouldAdd = true;
                break;
              }
            }
          }
          
          if (shouldAdd) {
            topScores.push(newScore);
            topScores.sort((a, b) => b.score - a.score);
            topScores = topScores.slice(0, 5); // Mantém apenas top 5
            localStorage.setItem('fugitivoTopScores', JSON.stringify(topScores));
          }
        }
        
        function keyPressed() {
          if ((key === ' ' || keyCode === UP_ARROW) && gameStarted && !gameOver) {
            bird.up();
            return false;
          }
        }
        
        function mousePressed() {
          if (gameStarted && !gameOver) {
            bird.up();
            return false;
          }
        }
        
        function handleTouchStart(e) {
          if (gameStarted && !gameOver) {
            e.preventDefault();
          }
        }
        
        function handleTouchEnd(e) {
          if (gameStarted && !gameOver) {
            e.preventDefault();
            const currentTime = new Date().getTime();
            if (currentTime - lastTapTime < tapDelay) return;
            lastTapTime = currentTime;
            bird.up();
          }
        }
        
        function windowResized() {
          resizeCanvas(windowWidth, windowHeight);
          if (!gameStarted) redraw();
        }
        
        function resetGame() {
          score = 0;
          gameOver = false;
          resetBird();
          pipes = [];
        }
        
        class Bird {
          constructor() {
            this.y = height / 2;
            this.x = width / 4;
            this.gravity = isMobile ? 0.5 : 0.6;
            this.lift = isMobile ? -9 : -12;
            this.velocity = 0;
            this.size = isMobile ? 30 : 40;
            this.neonColor = color(255, 0, 255);
            this.maxVelocity = isMobile ? 10 : 12;
          }
          
          show() {
            if (birdImg) {
              drawingContext.shadowBlur = 15;
              drawingContext.shadowColor = this.neonColor;
              image(birdImg, this.x - this.size/2, this.y - this.size/2, this.size, this.size);
              drawingContext.shadowBlur = 0;
            } else {
              drawingContext.shadowBlur = 20;
              drawingContext.shadowColor = this.neonColor;
              fill(0);
              stroke(this.neonColor);
              strokeWeight(2);
              ellipse(this.x, this.y, this.size, this.size);
              fill(this.neonColor);
              noStroke();
              textSize(16);
              textAlign(CENTER, CENTER);
              text("*-*", this.x, this.y);
              drawingContext.shadowBlur = 0;
            }
          }
          
          up() {
            this.velocity += this.lift;
            this.neonColor = color(random(200, 255), random(100), random(200, 255));
          }
          
          update() {
            this.velocity += this.gravity;
            this.velocity *= 0.9;
            if (Math.abs(this.velocity) > this.maxVelocity) {
              this.velocity = this.maxVelocity * Math.sign(this.velocity);
            }
            this.y += this.velocity;
            
            if (this.y > height - this.size/2) {
              this.y = height - this.size/2;
              this.velocity = 0;
            }
            if (this.y < this.size/2) {
              this.y = this.size/2;
              this.velocity = 0;
            }
          }
        }
        
class Pipe {
  constructor() {
    this.w = isMobile ? 60 : 80;
    this.x = width;
    this.speed = isMobile ? 2.5 : 3;
    this.counted = false;
    this.neonColor = color(0, 255, 255);
    this.gap = random(birdSize * 3, birdSize * 5);
    this.top = random(height / 6, height - this.gap - height / 6);
    this.bottom = this.top + this.gap;
  }

  hits(bird) {
    let hitX = bird.x + bird.size / 2 > this.x && bird.x - bird.size / 2 < this.x + this.w;
    let hitY = bird.y - bird.size / 2 < this.top || bird.y + bird.size / 2 > this.bottom;
    return hitX && hitY;
  }

  show() {
    drawingContext.shadowBlur = 10;
    drawingContext.shadowColor = this.neonColor;

    if (pipeImg) {
      image(pipeImg, this.x, 0, this.w, this.top);
      image(pipeImg, this.x, this.bottom, this.w, height - this.bottom);
    } else {
      fill(0);
      stroke(this.neonColor);
      strokeWeight(2);
      rect(this.x, 0, this.w, this.top);
      rect(this.x, this.bottom, this.w, height - this.bottom);
    }

    drawingContext.shadowBlur = 0;
  }

  update() {
    this.x -= this.speed;
  }

  offscreen() {
    return this.x + this.w < 0;
  }
}

      </script>
    </div>
  </body>
</html>
